name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content AGL.PTZ.Controller.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version' }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          & ./tools/Build-Distribution.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "../release/$env:GITHUB_REF_NAME"
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME "$dir/PTZ-Desk-Setup-x64.exe" "$dir/PTZ-Desk-Portable-x64.zip" --clobber
            if ($LASTEXITCODE) { throw 'Release asset replacement failed' }
            if ($env:GITHUB_REF_NAME -eq 'v1.0.0') {
              gh release edit v1.0.0 --latest
              if ($LASTEXITCODE) { throw 'Could not mark v1.0.0 as latest' }
              gh release delete v1.5.4 --cleanup-tag --yes
              if ($LASTEXITCODE) { throw 'Could not remove the old release and tag' }
            }
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME "$dir/PTZ-Desk-Setup-x64.exe" "$dir/PTZ-Desk-Portable-x64.zip" --verify-tag --generate-notes --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
